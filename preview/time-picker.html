$('prev-month').onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()-1);renderCalendar()};$('next-month').onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()+1);renderCalendar()};
function confirmDate(){$('time-date').textContent=dateLabel(draft.date);hours.set(draft.hour);minutes.set(draft.minute);showModal('time-modal');}
function confirmTime(){hours.finish();minutes.finish();draft.hour=hours.value;draft.minute=minutes.value;committed={...draft};display();closeModal();}
for(const el of document.querySelectorAll('.time-overlay')){el.inert=true;el.addEventListener('pointerdown',e=>{if(e.target===el)closeModal()})}
document.addEventListener('keydown',e=>{if(!activeModal)return;if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const items=[...$(activeModal).querySelectorAll('button,[tabindex="0"]')],first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
// Only seven numeric layers per wheel. Continuous positions are modulo-mapped;
// no DOM cloning or jump back to a central copy is needed at 23/59 -> 00.
class Wheel{
 constructor(id,count,value){this.el=$(id);this.count=count;this.pos=value;this.target=value;this.frame=0;this.nodes=Array.from({length:7},()=>{const n=document.createElement('div');n.className='wheel-item';n.setAttribute('aria-hidden','true');this.el.append(n);return n});this.velocity=0;this.drag=null;this.render();
 this.el.addEventListener('pointerdown',e=>{if(e.button!==0)return;this.stop();this.drag={id:e.pointerId,y:e.clientY,lastY:e.clientY,lastT:performance.now(),moved:0};this.velocity=0;this.el.setPointerCapture(e.pointerId);this.el.focus({preventScroll:true});});
 this.el.addEventListener('pointermove',e=>{if(!this.drag||e.pointerId!==this.drag.id)return;const now=performance.now(),dy=e.clientY-this.drag.lastY,dt=Math.max(4,now-this.drag.lastT);this.pos-=dy/68;this.velocity=this.velocity*.35+(-dy/68)/(dt/1000)*.65;this.drag.moved+=Math.abs(dy);this.drag.lastY=e.clientY;this.drag.lastT=now;this.render()});
 const end=(e,cancel=false)=>{if(!this.drag||e.pointerId!==this.drag.id)return;const d=this.drag;this.drag=null;const v=performance.now()-d.lastT>100?0:this.velocity;if(cancel){this.animate(Math.round(this.pos),0);return}if(d.moved<5){const rect=this.el.getBoundingClientRect(),steps=Math.round((e.clientY-rect.top-152)/68);this.animate(Math.round(this.pos)+steps,0)}else this.animate(Math.round(this.pos+Math.max(-9,Math.min(9,v*.16))),v)};
 this.el.addEventListener('pointerup',e=>end(e));this.el.addEventListener('pointercancel',e=>end(e,true));this.el.addEventListener('lostpointercapture',e=>{if(this.drag)end(e,true)});
 this.el.addEventListener('wheel',e=>{e.preventDefault();const dy=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?304:1);this.stop();this.pos+=Math.max(-3,Math.min(3,dy/68));this.render();clearTimeout(this.wheelTimer);this.wheelTimer=setTimeout(()=>{this.wheelTimer=0;this.animate(Math.round(this.pos),0)},90)},{passive:false});
 this.el.addEventListener('keydown',e=>{let step=0;if(e.key==='ArrowDown')step=1;if(e.key==='ArrowUp')step=-1;if(e.key==='PageDown')step=5;if(e.key==='PageUp')step=-5;if(step){e.preventDefault();this.animate(this.target+step,0)}if(e.key==='Home'||e.key==='End'){e.preventDefault();this.set(e.key==='Home'?0:this.count-1)}});
 }
 get value(){return mod(Math.round(this.pos),this.count)}
 set(n){this.stop();this.pos=n;this.target=n;this.render()}
 stop(){cancelAnimationFrame(this.frame);clearTimeout(this.wheelTimer);this.frame=0;this.target=Math.round(this.pos)}
 finish(){this.stop();this.pos=Math.round(this.pos);this.target=this.pos;this.render()}
 animate(target,velocity){this.stop();this.target=target;if(matchMedia('(prefers-reduced-motion: reduce)').matches){this.set(mod(target,this.count));return}const start=performance.now(),x=this.pos-target,v=Math.max(-50,Math.min(50,velocity)),w=22;const tick=now=>{const t=(now-start)/1000,decay=Math.exp(-w*t);this.pos=target+(x+(v+w*x)*t)*decay;this.render();if(t>.7||(Math.abs(this.pos-target)<.001&&t>.16)){this.pos=mod(target,this.count);this.target=this.pos;this.render();this.frame=0}else this.frame=requestAnimationFrame(tick)};this.frame=requestAnimationFrame(tick)}
 render(){const center=Math.round(this.pos);this.nodes.forEach((n,i)=>{const index=center+i-3,d=index-this.pos,ad=Math.abs(d);n.textContent=pad(mod(index,this.count));n.style.transform=`translate3d(0,${d*68}px,0) perspective(500px) rotateX(${-d*17}deg) scale(${1-Math.min(ad,3)*.18})`;n.style.opacity=Math.max(0,1-ad*.44);});this.el.setAttribute('aria-valuenow',this.value);this.el.setAttribute('aria-valuetext',pad(this.value));}
}
const hours=new Wheel('hour-wheel',24,19),minutes=new Wheel('minute-wheel',60,35),wheels=[hours,minutes];
const cats=[['food','餐饮美食'],['train','交通出行'],['bag','购物消费'],['daily','日用百货'],['home','居家生活'],['game','休闲娱乐'],['medical','医疗健康'],['other','其他支出']];let selected=0;
function renderCats(){$('category-grid').innerHTML=cats.map(([icon,name],i)=>`<button class="category ${selected===i?'active':''}" aria-pressed="${selected===i}" onclick="selected=${i};renderCats()"><span class="category-icon"><svg><use href="#${icon}"/></svg></span><span>${name}</span></button>`).join('');$('selected-label').textContent=cats[selected][1]}
function setMode(mode){document.querySelectorAll('.mode button').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',b.dataset.mode===mode)});$('amount-label').textContent=mode==='expense'?'支出金额':'收入金额'}
let raw='32.00';function pressKey(k){if(k==='backspace')raw=raw.slice(0,-1);else if(k==='.'&&!raw.includes('.'))raw+='.';else if(/^\d$/.test(k)&&raw.length<10&&(!raw.includes('.')||raw.split('.')[1].length<2))raw+=k;$('amount').value=raw||'0.00'}
function showToast(s){clearTimeout(toastTimer);$('toast').textContent=s;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2800)}
function previewSave(){showToast(`已预览修改：${dateLabel(committed.date)} ${pad(committed.hour)}:${pad(committed.minute)}`)}
renderCats();display();
