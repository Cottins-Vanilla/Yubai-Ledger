<style>
:root{--bg:#f7f8f4;--ink:#233e35;--green:#214e3e;--muted:#94a087;--line:#e4e9dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.screen{position:relative;width:412px;min-height:985px;margin:auto;display:flex;flex-direction:column;padding-bottom:17px}.status{height:39px;padding:13px 26px 0;display:flex;justify-content:space-between;font:600 13px Arial;flex-shrink:0}.signals{display:flex;gap:6px;align-items:center}.signals svg{width:17px;height:14px;stroke-width:1.8}.top{display:flex;align-items:center;justify-content:space-between;padding:17px 24px 23px}.back{display:grid;place-items:center;width:38px;height:38px;border:1px solid #e2e8dc;border-radius:14px;background:#fcfdf9;color:#667e57}.back svg{height:18px;width:18px}.top h1{font-size:20px;letter-spacing:1px;margin:0;font-weight:600}.spacer{width:38px}.main{padding:0 24px}.mode{display:flex;background:#eceedf;border-radius:15px;padding:4px;gap:4px}.mode button{width:50%;height:34px;color:#8d9b7e;font-size:12px;background:transparent;border-radius:12px}.mode button.active{background:#fdfefa;color:#345839;box-shadow:0 2px 6px #29452d0a;font-weight:600}.amount-area{margin-top:24px;padding:0 3px 19px;border-bottom:1px solid #dce4d3}.amount-label{display:flex;justify-content:space-between;font-size:11px;color:#8a9a7a}.currency-label{font-size:9px;letter-spacing:.5px;color:#a1ab95}.amount-line{display:flex;align-items:baseline;gap:9px;margin-top:12px}.currency{font:24px Arial;color:#789467}.amount-input{border:0;background:transparent;outline:0;width:100%;min-width:0;padding:0;color:#2b4e38;font:500 45px Arial;letter-spacing:-1px;caret-color:#6f8e54}.categories{margin-top:23px}.section-title{display:flex;justify-content:space-between;align-items:center}.section-title h2{font-size:12px;font-weight:500;margin:0;color:#6b7e5b}.selected-label{font-size:10px;color:#9ba78e}.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px 8px;margin-top:17px}.category{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;background:transparent;color:#8c9b7d;font-size:10px}.category-icon{height:43px;width:48px;border-radius:15px;display:grid;place-items:center;background:#fcfdf9;border:1px solid #e4e9dc;transition:background .15s ease,border-color .15s ease}.category svg{width:21px;height:21px}.category.active{color:#48663a;font-weight:600}.category.active .category-icon{background:#e0eacb;border-color:#cfddba}.meta{margin-top:24px;border-top:1px solid var(--line)}.field-row{display:flex;align-items:center;gap:11px;min-height:47px;border-bottom:1px solid var(--line);font-size:11px;color:#7b8c6b}.field-row>svg{width:17px;height:17px;color:#92a382;flex-shrink:0}.field-label{flex-shrink:0}.field-row input{min-width:0;flex:1;border:0;background:transparent;outline:0;color:#536e44;font-size:11px;text-align:right;padding:10px 0}.field-row input::placeholder{color:#a5ae9a}.field-row input[type=date]{color-scheme:light;width:130px;flex:0 0 139px;margin-left:auto}.field-row input[type=date]::-webkit-calendar-picker-indicator{opacity:.35;width:12px;margin-left:9px}.keyboard-area{padding:23px 24px 23px;margin-top:auto}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.key{height:51px;border-radius:13px;background:#eff2e9;color:#3d5b3b;font:400 23px Arial;display:grid;place-items:center;transition:background .12s,transform .12s;touch-action:manipulation}.key:active{background:#dee8cd;transform:scale(.97)}.key svg{width:21px;height:21px}.save{margin-top:15px;height:52px;width:100%;border-radius:16px;background:var(--green);color:#f4f8ee;font-size:13px;letter-spacing:1px;display:flex;justify-content:center;align-items:center;gap:8px;box-shadow:0 6px 15px #214e3e10}.save svg{width:17px;height:17px}.save:disabled{opacity:.45;cursor:default;box-shadow:none}.homebar{position:absolute;width:116px;height:4px;background:#213b2c;border-radius:4px;bottom:8px;left:calc(50% - 58px)}.toast{position:absolute;bottom:112px;left:24px;right:24px;background:#2e503c;color:white;border-radius:13px;font-size:11px;padding:13px 16px;line-height:1.7;z-index:3;box-shadow:0 5px 18px #243b2320}.toast[hidden]{display:none}button:focus-visible,input:focus-visible{outline:2px solid #8eaa70;outline-offset:3px}@media(max-width:411px){.screen{width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<svg style="display:none"><defs>
<symbol id="food" viewBox="0 0 24 24"><path d="M3 10h18a9 9 0 0 1-18 0ZM9 21h6M7 3v4m5-5v5m5-4v4"/></symbol>
<symbol id="train" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="16" rx="4"/><path d="M5 11h14M12 3v8m-5 11 2-3m6 0 2 3M8 15h1m6 0h1"/></symbol>
<symbol id="bag" viewBox="0 0 24 24"><path d="M5 7h14l1 14H4ZM8 8V6a4 4 0 0 1 8 0v2"/></symbol>
<symbol id="daily" viewBox="0 0 24 24"><path d="M8 7h8v14H8ZM10 7V4h6M10 3h7M8 12h8"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3ZM9 20v-7h6v7"/></symbol>
<symbol id="game" viewBox="0 0 24 24"><path d="M7 7h10c4 0 5 12 2 12l-4-4H9l-4 4C2 19 3 7 7 7ZM8 9v6m-3-3h6m5-1h.1m2 3h.1"/></symbol>

<symbol id="wallet" viewBox="0 0 24 24"><path d="M4 6V5a2 2 0 0 1 2-2h12v4M4 7h16v14H6a2 2 0 0 1-2-2V7Zm16 5h-6v5h6M17 14.5h.1"/></symbol>

<symbol id="trend" viewBox="0 0 24 24"><path d="M4 3v17h17M7 14l5-6 4 3 5-7m-5 0h5v5"/></symbol>
<symbol id="work" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="3"/><path d="M8 7V3h8v4M3 13q9 5 18 0M10 14h4v3h-4Z"/></symbol>
<symbol id="redpacket" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="m5 6 7 5 7-5M10 14l2 2 2-2m-2 2v3"/></symbol>
<symbol id="refund" viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1 0 7M4 4v5h5M12 7v9m-3-6 3 2 3-2m-6 5h6"/></symbol>
</defs></svg>
<main class="screen">
<div class="status"><span>9:41</span><div class="signals"><svg viewBox="0 0 20 16"><path d="M2 13v-2m4 2V8m4 5V5m4 8V2"/></svg><svg viewBox="0 0 20 16"><path d="M2 5q8-7 16 0M5 8q5-4 10 0m-7 3q2-2 4 0m-2 2h.01"/></svg><svg viewBox="0 0 22 16"><rect x="1" y="3" width="17" height="10" rx="2"/><path d="M21 6v4"/><path stroke-width="6" d="M5 8h9"/></svg></div></div>
<header class="top"><button class="back" aria-label="返回明细" onclick="location.href='home.html'"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg></button><h1>记一笔</h1><div class="spacer"></div></header>
<div class="main"><div class="mode" role="group" aria-label="收支类型"><button class="active" data-mode="expense" aria-pressed="true" onclick="setMode('expense')">支出</button><button data-mode="income" aria-pressed="false" onclick="setMode('income')">收入</button></div>
<section class="amount-area"><div class="amount-label"><label for="amount" id="amount-label">支出金额</label><span class="currency-label">人民币</span></div><div class="amount-line"><span class="currency">¥</span><input class="amount-input" id="amount" readonly inputmode="none" value="0.00" aria-label="金额，使用下方数字键盘输入"></div></section>
<section class="categories"><div class="section-title"><h2>选择分类</h2><span class="selected-label" id="selected-label">餐饮美食</span></div><div class="category-grid" id="category-grid" role="group" aria-label="账目分类"></div></section>
<div class="meta"><label class="field-row"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-12 4h2m4 0h2"/></svg><span class="field-label">日期</span><input id="date" type="date" value="2026-11-16" aria-label="账目日期" required></label><label class="field-row"><svg viewBox="0 0 24 24"><path d="M13 4H5v17h14v-8M11 13l-1 4 4-1 7-7-3-3-7 7Z"/></svg><span class="field-label">备注</span><input id="note" type="text" maxlength="100" placeholder="写点什么，方便日后查看" aria-label="账目备注"></label></div></div>
<div class="keyboard-area"><div class="keypad" role="group" aria-label="金额键盘">
<button class="key" onclick="pressKey('1')">1</button><button class="key" onclick="pressKey('2')">2</button><button class="key" onclick="pressKey('3')">3</button>
<button class="key" onclick="pressKey('4')">4</button><button class="key" onclick="pressKey('5')">5</button><button class="key" onclick="pressKey('6')">6</button>
<button class="key" onclick="pressKey('7')">7</button><button class="key" onclick="pressKey('8')">8</button><button class="key" onclick="pressKey('9')">9</button>
<button class="key" onclick="pressKey('.')" aria-label="小数点">.</button><button class="key" onclick="pressKey('0')">0</button><button class="key" onclick="pressKey('backspace')" aria-label="删除一位"><svg viewBox="0 0 24 24"><path d="M9 5h12v14H9l-7-7 7-7Zm3 4 6 6m0-6-6 6"/></svg></button>
</div><button class="save" id="save" onclick="previewSave()" disabled><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg><span>保存账目</span></button></div><div class="homebar"></div><div class="toast" id="toast" role="status" hidden></div>
</main>
<script src="demo-data.js"></script>
<script>
const categorySets={expense:[['餐饮美食','餐饮','food'],['交通出行','交通','train'],['购物消费','购物','bag'],['生活日用','日用','daily'],['居家住房','居家','home'],['休闲娱乐','娱乐','game'],['医疗健康','医疗','medical'],['其他支出','其他','other']],income:[['工资收入','工资','wallet'],['奖金收入','奖金','gift'],['投资收益','理财','trend'],['兼职收入','兼职','work'],['红包收入','红包','redpacket'],['退款收入','退款','refund'],['礼金收入','礼金','gift'],['其他收入','其他','other']]};
let mode='expense',rawAmount='0',selected={expense:0,income:0},toastTimer;
function cents(){const parts=rawAmount.split('.');return Number(parts[0])*100+Number((parts[1]||'').padEnd(2,'0'))}
function renderAmount(){const parts=rawAmount.split('.');const integer=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');document.getElementById('amount').value=integer+(parts.length===1?'.00':'.'+parts[1]);document.getElementById('save').disabled=cents()===0}
function pressKey(key){if(key==='backspace'){rawAmount=rawAmount.slice(0,-1)||'0'}else if(key==='.'){if(!rawAmount.includes('.'))rawAmount+='.'}else if(/^\d$/.test(key)){const parts=rawAmount.split('.');if(parts.length===2&&parts[1].length>=2)return;if(parts.length===1&&parts[0].length>=9&&rawAmount!=='0')return;rawAmount=rawAmount==='0'?key:rawAmount+key}renderAmount()}
function setMode(next){mode=next;document.querySelectorAll('[data-mode]').forEach(el=>{const active=el.dataset.mode===mode;el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active))});document.getElementById('amount-label').textContent=(mode==='expense'?'支出':'收入')+'金额';renderCategories()}
function renderCategories(){document.getElementById('category-grid').innerHTML=categorySets[mode].map((c,i)=>`<button class="category ${selected[mode]===i?'active':''}" data-index="${i}" aria-pressed="${selected[mode]===i}" onclick="selectCategory(${i})"><span class="category-icon"><svg><use href="#${c[2]}"/></svg></span><span>${c[1]}</span></button>`).join('');document.getElementById('selected-label').textContent=categorySets[mode][selected[mode]][0]}
function selectCategory(i){selected[mode]=i;renderCategories()}
function showToast(text){clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=text;el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,3400)}
function previewSave(){if(cents()<=0){showToast('请输入大于 0 的金额');return false}const date=document.getElementById('date');if(!date.value||!date.checkValidity()){showToast('请选择有效日期');return false}showToast(editRecord?'原型演示：修改已校验，正式版将更新原账目。':'原型演示：金额与日期已校验，正式版将保存到本地账本。');return true}
document.addEventListener('keydown',e=>{if(e.target.matches('#note,#date'))return;if(/^\d$/.test(e.key)||e.key==='.'){e.preventDefault();pressKey(e.key)}else if(e.key==='Backspace'){e.preventDefault();pressKey('backspace')}});
const params=new URLSearchParams(location.search);if(params.get('mode')==='income')mode='income';if(params.get('demo')==='1'){rawAmount=mode==='expense'?'32.00':'15000.00';document.getElementById('note').value=mode==='expense'?'午餐':'十一月工资'}const editRecord=window.demoLedgerRecords?.[params.get('edit')];if(editRecord){mode=editRecord.type;rawAmount=Math.floor(editRecord.cents/100)+'.'+String(editRecord.cents%100).padStart(2,'0');document.getElementById('note').value=editRecord.note;document.getElementById('date').value=editRecord.date;const index=categorySets[mode].findIndex(c=>c[0]===editRecord.category);selected[mode]=index<0?0:index;document.querySelector('.top h1').textContent='编辑账目';document.querySelector('.save span').textContent='保存修改';document.querySelector('.back').setAttribute('aria-label','返回账单详情');document.querySelector('.back').onclick=()=>location.href='home.html#detail='+encodeURIComponent(editRecord.id);document.title='编辑账目 · 设计预览 01';}setMode(mode);renderAmount();
</script>
</html>
