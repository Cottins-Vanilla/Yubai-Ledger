<script>
const expenseCents=[7800,12500,6200,18800,9500,24000,11000,15800,10000,10000,18000,8500,14000,21000,20000,6850];
const incomeCents=Array.from({length:16},(_,i)=>i===14?1500000:0);
let trendMode='expense',categoryMode='expense',selectedDay=null;
const scroller=document.getElementById('plot-scroll');
const tooltip=document.getElementById('point-tooltip');
let chartGeometry=null,scrollInitialized=false,renderCount=0;
const fmt=c=>(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

function clearPoint(){selectedDay=null;tooltip.hidden=true;document.querySelectorAll('.trend-dot.selected').forEach(e=>e.classList.remove('selected'))}
function renderTrend(){
renderCount++;clearPoint();stopMomentum();
const data=trendMode==='expense'?expenseCents:incomeCents;
const max=Math.max(1,...data.map(v=>v/100));const step=max>1000?5000:50;const ceiling=Math.max(step,Math.ceil(max/step)*step);
const spacing=44,pad=15,W=Math.max(scroller.clientWidth,(data.length-1)*spacing+pad*2),T=15,B=120;
const px=i=>pad+i*spacing,py=v=>B-(v/100)/ceiling*(B-T);
let axis='',s='<title>'+(trendMode==='expense'?'每日支出':'每日收入')+'趋势</title><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#82a16c" stop-opacity=".2"/><stop offset="1" stop-color="#82a16c" stop-opacity="0"/></linearGradient></defs>';
for(let i=0;i<3;i++){const y=T+(B-T)*i/2,v=ceiling*(1-i/2);axis+=`<text x="25" y="${y+3}" text-anchor="end" fill="#a1ac96" font-size="9" font-family="Arial">${v>=1000?(v/1000)+'k':v}</text>`;s+=`<path d="M0 ${y}H${W}" stroke="#e9eee2" stroke-width="1" stroke-dasharray="3 4"/>`;}
const coords=data.map((v,i)=>`${px(i)},${py(v)}`).join(' ');
s+=`<polygon points="${px(0)},${B} ${coords} ${px(data.length-1)},${B}" fill="url(#fade)"/><polyline points="${coords}" stroke="#527a4a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
data.forEach((v,i)=>{s+=`<text x="${px(i)}" y="143" text-anchor="middle" fill="#97a48a" font-size="9" font-family="Arial">11/${String(i+1).padStart(2,'0')}</text><circle class="trend-dot" data-index="${i}" cx="${px(i)}" cy="${py(v)}" r="2.5" fill="#fdfefa" stroke="#527a4a" stroke-width="1.7"/><circle class="trend-hit" data-index="${i}" cx="${px(i)}" cy="${py(v)}" r="12" fill="transparent"/>`;});
document.getElementById('y-axis').innerHTML=axis;const svg=document.getElementById('trend');svg.setAttribute('viewBox',`0 0 ${W} 151`);svg.style.width=W+'px';svg.innerHTML=s;
scroller.setAttribute('aria-label',`${trendMode==='expense'?'每日支出':'每日收入'}折线图，11月1日至16日，可横向滚动`);
chartGeometry={data,px,py,W};if(!scrollInitialized){scroller.scrollLeft=scroller.scrollWidth-scroller.clientWidth;scrollInitialized=true;}
}
function setTrend(mode){trendMode=mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));renderTrend()}
function selectPoint(clientX){if(!chartGeometry)return;clearPoint();const rect=scroller.getBoundingClientRect();const index=Math.max(0,Math.min(chartGeometry.data.length-1,Math.round((clientX-rect.left+scroller.scrollLeft-15)/44)));selectedDay=index+1;const dot=document.querySelector(`.trend-dot[data-index="${index}"]`);dot.classList.add('selected');tooltip.textContent=`11/${String(index+1).padStart(2,'0')} · ${trendMode==='expense'?'−':'+'} ¥${fmt(chartGeometry.data[index])}`;tooltip.hidden=false;const relativeX=31+chartGeometry.px(index)-scroller.scrollLeft;tooltip.style.left=Math.max(31,Math.min(document.getElementById('plot').clientWidth-tooltip.offsetWidth,relativeX-tooltip.offsetWidth/2))+'px';tooltip.style.top=Math.max(0,chartGeometry.py(chartGeometry.data[index])-32)+'px';}
const categoryData=[['餐饮美食',96278,'#456c4d'],['购物消费',53487,'#91aa70'],['交通出行',32093,'#c2cf9d'],['生活日用',21395,'#ddceaa'],['其他',10697,'#e4e9da']];
function setCategories(mode){categoryMode=mode;document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('active',b.dataset.cat===mode));const list=mode==='expense'?categoryData:[['工资收入',1500000,'#456c4d']];const total=list.reduce((s,c)=>s+c[1],0);let start=0;const stops=list.map(c=>{const a=start;start+=c[1]/total*100;return `${c[2]} ${a}% ${start}%`});document.getElementById('donut').style.background=`conic-gradient(${stops.join(',')})`;document.getElementById('donut').setAttribute('aria-label',mode==='expense'?'支出分类环形饼图':'收入分类环形饼图');document.getElementById('donut-label').textContent=mode==='expense'?'总支出':'总收入';document.getElementById('donut-total').textContent=fmt(total);document.getElementById('legend').innerHTML=list.map(c=>`<div class="legend-row"><span class="legend-dot" style="background:${c[2]}"></span><span class="name">${c[0]}</span><b>${fmt(c[1])}</b><small>${(c[1]/total*100).toFixed(0)}%</small></div>`).join('');document.getElementById('category-highlight').textContent=list[0][0]+'占比最高';document.getElementById('category-percent').textContent=(list[0][1]/total*100).toFixed(1)+'%'}

let momentumFrame=0,drag=null,suppressClick=false;
function stopMomentum(){if(momentumFrame)cancelAnimationFrame(momentumFrame);momentumFrame=0;}
function glide(velocity){stopMomentum();if(matchMedia('(prefers-reduced-motion: reduce)').matches||Math.abs(velocity)<.03)return;let previous=performance.now();const frame=now=>{const dt=Math.min(32,now-previous);previous=now;const before=scroller.scrollLeft;scroller.scrollLeft+=velocity*dt;velocity*=Math.exp(-dt/160);if(Math.abs(velocity)>.03&&Math.abs(scroller.scrollLeft-before)>.05){momentumFrame=requestAnimationFrame(frame)}else{momentumFrame=0}};momentumFrame=requestAnimationFrame(frame);}
scroller.addEventListener('pointerdown',e=>{stopMomentum();suppressClick=false;if(e.pointerType!=='mouse'||e.button!==0)return;e.preventDefault();scroller.setPointerCapture(e.pointerId);drag={id:e.pointerId,startX:e.clientX,startY:e.clientY,x:e.clientX,time:e.timeStamp,velocity:0,moved:false};});
scroller.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;if(!drag.moved){if(Math.abs(e.clientX-drag.startX)<4)return;if(Math.abs(e.clientY-drag.startY)>Math.abs(e.clientX-drag.startX)){drag=null;return}drag.moved=true;scroller.classList.add('dragging');clearPoint();}const dt=Math.max(1,e.timeStamp-drag.time),dx=e.clientX-drag.x;scroller.scrollLeft-=dx;drag.velocity=.65*drag.velocity+.35*(-dx/dt);drag.x=e.clientX;drag.time=e.timeStamp;e.preventDefault();});
scroller.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const state=drag;drag=null;scroller.classList.remove('dragging');if(state.moved){suppressClick=true;glide(e.timeStamp-state.time<90?state.velocity:0)}if(scroller.hasPointerCapture(e.pointerId))scroller.releasePointerCapture(e.pointerId);});
scroller.addEventListener('pointercancel',()=>{drag=null;scroller.classList.remove('dragging');stopMomentum()});
scroller.addEventListener('lostpointercapture',()=>{drag=null;scroller.classList.remove('dragging')});
scroller.addEventListener('click',e=>{if(suppressClick){suppressClick=false;return}selectPoint(e.clientX)});
scroller.addEventListener('scroll',clearPoint,{passive:true});
scroller.addEventListener('wheel',stopMomentum,{passive:true});
scroller.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();stopMomentum();scroller.scrollBy({left:e.key==='ArrowLeft'?-44:44,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMomentum()});
let timer;function hint(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),2800)}
window.addEventListener('resize',renderTrend);renderTrend();setCategories('expense');
</script></html>
