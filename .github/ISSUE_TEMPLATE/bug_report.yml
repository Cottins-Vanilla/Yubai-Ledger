name: 问题反馈
description: 报告可复现的问题，请勿上传真实账本或私人信息。
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 1.0.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android 版本与设备型号
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请说明操作步骤，以及实际结果和预期结果。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或最小示例（可选）
      description: 请先移除真实金额、备注和其他私人信息。
