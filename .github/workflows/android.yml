name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Pinned instead of ubuntu-latest: the runner image moves to Ubuntu 26 in late 2026 and the
    # Robolectric/Compose unit tests depend on the image's native graphics stack.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      # Robolectric downloads its Android runtime jars (~300 MB) on first use into ~/.m2.
      # Without this cache a cold runner spends minutes fetching them before any test starts.
      - name: Cache Robolectric Android runtimes
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-jars-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            robolectric-jars-${{ runner.os }}-
      - name: Test, lint, and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-check-results
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk
